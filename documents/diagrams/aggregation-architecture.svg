    <text x="765" y="170">AppleValidator</text>
    <text x="765" y="185" font-size="10" fill="#444444">App Store Server API</text>
    <text x="765" y="224">GoogleValidator</text>
    <text x="765" y="239" font-size="10" fill="#444444">Play Developer API</text>
    <text x="765" y="278">CustomValidator</text>
