  <g font-size="12" fill="#111111" text-anchor="middle">
    <text x="320" y="73">游戏逻辑 / UI</text>

    <text x="170" y="162">GGPlatform 门面</text>
    <text x="170" y="178" font-size="10" fill="#444444">Login / Pay / Restore / SubmitData</text>
