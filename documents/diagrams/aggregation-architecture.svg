    <text x="250" y="416">GooglePlay</text>
    <text x="250" y="431" font-size="10" fill="#444444">:IPayChannel</text>
    <text x="386" y="416">Custom</text>
    <text x="386" y="431" font-size="10" fill="#444444">:ILogin+IPay</text>
