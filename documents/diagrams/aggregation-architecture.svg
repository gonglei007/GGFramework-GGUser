    <text x="50" y="138">GGPlatform 聚合门面</text>
    <text x="50" y="298">能力抽象（可组合）</text>
    <text x="50" y="394">渠道适配器（插件）</text>
    <text x="50" y="508">原生平台 / 桥接</text>
    <text x="660" y="138" fill="#2f5b8f">自建服务端</text>
  </g>

