    <line x1="280" y1="166" x2="318" y2="166" marker-end="url(#arrow)"/>
    <line x1="170" y1="192" x2="170" y2="198" marker-end="url(#arrow)"/>
    <line x1="280" y1="224" x2="318" y2="224" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <line x1="430" y1="192" x2="405" y2="292" marker-end="url(#arrow)"/>
    <line x1="114" y1="392" x2="330" y2="342" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
    <line x1="250" y1="392" x2="360" y2="342" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
    <line x1="386" y1="392" x2="200" y2="342" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
    <line x1="524" y1="392" x2="440" y2="342" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
