<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>

  <g stroke="#999999" stroke-dasharray="4,4">
    <line x1="90" y1="76" x2="90" y2="686"/>
    <line x1="250" y1="76" x2="250" y2="686"/>
    <line x1="410" y1="76" x2="410" y2="686"/>
    <line x1="570" y1="76" x2="570" y2="686"/>
    <line x1="730" y1="76" x2="730" y2="686"/>
    <line x1="900" y1="76" x2="900" y2="686"/>
  </g>

  <g stroke-width="1.5" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="20" y="40" width="140" height="36" fill="#dae8fc" stroke="#6c8ebf"/><text x="90" y="63" fill="#111">游戏业务</text>
    <rect x="180" y="40" width="140" height="36" fill="#d5e8d4" stroke="#82b366"/><text x="250" y="63" fill="#111">GGPlatform 门面</text>
    <rect x="340" y="40" width="140" height="36" fill="#d5e8d4" stroke="#82b366"/><text x="410" y="63" fill="#111">ChannelRouter</text>
    <rect x="500" y="40" width="140" height="36" fill="#ffe6cc" stroke="#d79b00"/><text x="570" y="63" fill="#111">IPayChannel</text>
    <rect x="660" y="40" width="140" height="36" fill="#e1d5e7" stroke="#9673a6"/><text x="730" y="63" fill="#111">商店 Apple/Google</text>
    <rect x="820" y="40" width="160" height="36" fill="#f8cecc" stroke="#b85450"/><text x="900" y="63" fill="#111">GGPay 网关(服务端)</text>
  </g>

  <g stroke="#333333" stroke-width="1.5" fill="none">
    <line x1="90" y1="112" x2="248" y2="112" marker-end="url(#arrow)"/>
    <line x1="250" y1="148" x2="408" y2="148" marker-end="url(#arrow)"/>
    <line x1="410" y1="184" x2="252" y2="184" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <line x1="250" y1="224" x2="568" y2="224" marker-end="url(#arrow)"/>
    <line x1="570" y1="260" x2="728" y2="260" marker-end="url(#arrow)"/>
    <line x1="730" y1="300" x2="572" y2="300" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <line x1="570" y1="336" x2="252" y2="336" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <line x1="250" y1="376" x2="898" y2="376" marker-end="url(#arrow)"/>
    <line x1="900" y1="460" x2="252" y2="460" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <line x1="250" y1="498" x2="568" y2="498" marker-end="url(#arrow)"/>
    <line x1="570" y1="534" x2="728" y2="534" marker-end="url(#arrow)"/>
    <line x1="250" y1="574" x2="92" y2="574" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
  </g>

  <g font-size="10" fill="#111111" text-anchor="middle">
    <text x="170" y="106">1: Pay(PayRequest)</text>
    <text x="330" y="142">2: Resolve(ctx)</text>
    <text x="330" y="178">3: 选中渠道</text>
    <text x="410" y="218">4: QueryProducts / Purchase</text>
    <text x="650" y="254" font-size="9">5: 发起购买(billing/payment)</text>
    <text x="650" y="294" font-size="9">6: receipt/token(异步)</text>
    <text x="410" y="330">7: PurchaseResult{receipt,token,txId}</text>
    <text x="575" y="370">8: POST /verify {channel, receipt, orderId}</text>
    <text x="575" y="454">10: {delivered, items}</text>
    <text x="410" y="492">11: FinishTransaction / consume</text>
    <text x="650" y="528" font-size="9">12: finish / consumeAsync</text>
    <text x="170" y="568">13: onEvent(Delivered)</text>
  </g>

  <g stroke="#d6b656" fill="#fff2cc" stroke-width="1.2" font-size="10" text-anchor="middle">
    <rect x="640" y="392" width="340" height="40"/>
    <text x="810" y="409" fill="#111">9: 按 channel 分发 Validator 校验票据</text>
    <text x="810" y="424" fill="#333" font-size="9">Apple verifyReceipt / Google purchases.get / Custom</text>
  </g>

  <g stroke="#6c8ebf" fill="#eef7ff" stroke-width="1.2" font-size="10">
    <rect x="120" y="602" width="700" height="40"/>
    <text x="130" y="619" fill="#333">掉单补单：启动时 IPayChannel.QueryUnfinished() 拉取未完成事务 → 走同样的 8~12 校验/发货/finish 流程；</text>
    <text x="130" y="634" fill="#333">网关侧对未确认订单保留重试队列。</text>
  </g>

  <g>
    <rect x="20" y="700" width="960" height="50" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/>
    <text x="30" y="720" font-size="11" fill="#333">铁律：只有第 10 步服务端确认 delivered 后，客户端才执行第 11/12 步 FinishTransaction / consume，避免扣款未到账或重复发货。</text>
    <text x="30" y="739" font-size="11" fill="#333">编辑器下由 SimulationChannel 直接回调 PurchaseResult，可脱离真机跑通全链路。</text>
  </g>
</svg>
