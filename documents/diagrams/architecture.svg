<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#333333"/>
    </marker>
    <marker id="arrowHollow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5 L0,10 Z" fill="#ffffff" stroke="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="640" fill="#ffffff"/>

  <!-- bands -->
  <g stroke="#999999" fill="#f5f5f5">
    <rect x="40" y="40" width="560" height="70"/>
    <rect x="40" y="140" width="560" height="90"/>
    <rect x="40" y="260" width="560" height="90"/>
    <rect x="40" y="380" width="560" height="90"/>
    <rect x="40" y="500" width="560" height="80"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#444444">
    <text x="50" y="58">游戏业务层</text>
    <text x="50" y="158">GGUser 门面层</text>
    <text x="50" y="278">SDK 抽象层</text>
    <text x="50" y="398">渠道实现</text>
    <text x="50" y="518">原生平台</text>
  </g>

  <!-- edges (draw first, under nodes) -->
  <g stroke="#333333" fill="none" stroke-width="1.5">
    <line x1="330" y1="94" x2="180" y2="163" marker-end="url(#arrow)"/>
    <line x1="260" y1="189" x2="336" y2="189" marker-end="url(#arrow)"/>
    <line x1="400" y1="213" x2="180" y2="283" marker-end="url(#arrow)"/>
    <line x1="430" y1="333" x2="388" y2="406" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="115" y1="408" x2="150" y2="335" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
    <line x1="250" y1="408" x2="165" y2="335" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
    <line x1="385" y1="408" x2="185" y2="335" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
    <line x1="520" y1="408" x2="205" y2="335" stroke-dasharray="5,4" marker-end="url(#arrowHollow)"/>
    <line x1="115" y1="452" x2="240" y2="520" marker-end="url(#arrow)"/>
    <line x1="385" y1="452" x2="345" y2="520" marker-end="url(#arrow)"/>
    <line x1="520" y1="452" x2="430" y2="520" marker-end="url(#arrow)"/>
    <line x1="650" y1="189" x2="524" y2="189" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <line x1="650" y1="255" x2="524" y2="205" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
  </g>
  <g font-size="10" fill="#666666">
    <text x="405" y="372">create</text>
    <text x="250" y="372">realize</text>
    <text x="560" y="180">委托注入</text>
  </g>

  <!-- nodes -->
  <g stroke-width="1.5">
    <rect x="250" y="58" width="160" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="80" y="165" width="180" height="48" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="340" y="165" width="180" height="48" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="80" y="285" width="150" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
    <rect x="340" y="285" width="180" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
    <rect x="55" y="408" width="120" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="190" y="408" width="120" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="325" y="408" width="120" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="460" y="408" width="120" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="180" y="522" width="300" height="40" rx="6" fill="#f8cecc" stroke="#b85450"/>
    <rect x="650" y="165" width="170" height="48" rx="6" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="650" y="235" width="170" height="48" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  </g>

  <g font-size="12" fill="#111111" text-anchor="middle">
    <text x="330" y="81">游戏逻辑 / UI</text>

    <text x="170" y="185">UserManager</text>
    <text x="170" y="201" font-size="10" fill="#444444">Init / Login / Pay / SubmitData</text>

    <text x="430" y="185">UserSystem</text>
    <text x="430" y="201" font-size="10" fill="#444444">状态机 + 事件广播</text>

    <text x="155" y="305">ISDK 接口</text>
    <text x="155" y="321" font-size="10" fill="#444444">（策略模式）</text>

    <text x="430" y="305">SDKFactory</text>
    <text x="430" y="321" font-size="10" fill="#444444">CreateSDK(target)</text>

    <text x="115" y="434">QuickSDK</text>
    <text x="250" y="434">ZhiShangSDK</text>
    <text x="385" y="428">NativeSDK</text>
    <text x="385" y="443" font-size="10" fill="#444444">（默认）</text>
    <text x="520" y="434">InternalSDK</text>

    <text x="330" y="540">NativeLuaBridge</text>
    <text x="330" y="555" font-size="10" fill="#444444">Android / iOS 双向桥接</text>

    <text x="735" y="185">UIAdaptor</text>
    <text x="735" y="201" font-size="10" fill="#444444">弹窗 / 本地化 / 等待</text>
    <text x="735" y="255">LogAdaptor</text>
    <text x="735" y="271" font-size="10" fill="#444444">错误 / 网络异常上报</text>
  </g>
</svg>
