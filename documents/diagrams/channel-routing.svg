<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>

  <!-- edges -->
  <g stroke="#333333" stroke-width="1.5" fill="none">
    <line x1="470" y1="68" x2="470" y2="102" marker-end="url(#arrow)"/>
    <line x1="470" y1="160" x2="470" y2="194" marker-end="url(#arrow)"/>
    <line x1="470" y1="280" x2="470" y2="314" marker-end="url(#arrow)"/>
    <line x1="560" y1="238" x2="638" y2="230" marker-end="url(#arrow)"/>
    <line x1="470" y1="372" x2="470" y2="406" marker-end="url(#arrow)"/>
    <line x1="380" y1="450" x2="292" y2="450" marker-end="url(#arrow)"/>
    <path d="M560,450 L730,450 L730,374" marker-end="url(#arrow)"/>
    <path d="M640,344 L595,344 L595,246 L562,246" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <line x1="320" y1="137" x2="348" y2="132" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
  </g>
  <g font-size="10" fill="#666666">
    <text x="480" y="302">是 / 有候选</text>
    <text x="576" y="222">否 / 队列空</text>
    <text x="300" y="442">是 / 可用</text>
    <text x="600" y="442">否 / 不可用</text>
    <text x="600" y="300" text-anchor="end">回退 fallback</text>
  </g>

  <!-- nodes -->
  <g stroke-width="1.5">
    <rect x="370" y="24" width="200" height="44" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="350" y="104" width="240" height="56" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="30" y="92" width="290" height="90" rx="6" fill="#eef7ff" stroke="#6c8ebf"/>
    <polygon points="470,196 560,238 470,280 380,238" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="350" y="316" width="240" height="56" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
    <polygon points="470,408 560,450 470,492 380,450" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="80" y="418" width="210" height="64" rx="10" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="640" y="316" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#666666"/>
    <rect x="640" y="200" width="190" height="56" rx="10" fill="#f8cecc" stroke="#b85450"/>
  </g>

  <g font-size="12" fill="#111111" text-anchor="middle">
    <text x="470" y="51">收到 PayRequest(ctx)</text>
    <text x="470" y="128">构建候选渠道队列</text>
    <text x="470" y="146" font-size="10" fill="#444444">平台硬约束 + 配置优先级</text>
    <text x="470" y="243">队列非空?</text>
    <text x="470" y="340">取队首渠道</text>
    <text x="470" y="358" font-size="10" fill="#444444">Connect + QueryProducts</text>
    <text x="470" y="455">可用?</text>
    <text x="185" y="445">选中渠道</text>
    <text x="185" y="463" font-size="10" fill="#444444">→ 进入购买 / 校验流程</text>
    <text x="730" y="348">出队该渠道</text>
    <text x="735" y="224">全部失败：降级 / 报错</text>
    <text x="735" y="242" font-size="10" fill="#444444">（UIAdaptor 弹窗）</text>
  </g>

  <g font-size="10" fill="#333333">
    <text x="40" y="110">队列构建规则：</text>
    <text x="40" y="128">· iOS：[AppStore]（虚拟商品强制）</text>
    <text x="40" y="146">· Android 海外：[GooglePlay, …]</text>
    <text x="40" y="164">· Android 国内：[自定义 / 第三方 按配置]</text>
    <text x="40" y="180">· routeHint 可强制指定渠道</text>
  </g>
</svg>
